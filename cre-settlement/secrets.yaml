# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the secret ID the workflow requests with `runtime.getSecret({ id })` to
# the environment variable holding its value.
#
# POSITIONS holds the market's PRIVATE positions as a JSON array:
#   [{"outcome":0,"amount":"1000000"},{"outcome":1,"amount":"5000000"}, ...]
# where `amount` is USDC base units (6 decimals). The Vault DON releases this
# directly into the attested enclave — it is never exposed in plaintext to node
# operators or to Workflow DON node memory. The per-bettor side and amount are
# exactly the data Obscura keeps shielded; only the aggregate per-outcome totals
# ever leave the enclave.
secretsNames:
    POSITIONS:
        - SECRET_POSITIONS
