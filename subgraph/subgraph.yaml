specVersion: 1.3.0
description: Obscura Protocol — privacy-first prediction markets. Indexes public and aggregate data plus commitments/nullifiers only; never plaintext positions.
repository: https://github.com/AshiqAhamed17/obscura-protocol
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum/contract
    name: PredictionMarket
    network: sepolia
    source:
      address: "0x3B50a4e83cD1f1AEF171749371A6c25CA07358bD"
      abi: PredictionMarket
      startBlock: 11652891
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Market
        - Deposit
        - Settlement
        - Claim
        - ProtocolSolvency
      abis:
        - name: PredictionMarket
          file: ./abis/PredictionMarket.json
      eventHandlers:
        - event: MarketCreated(indexed uint256,address,int256,uint256)
          handler: handleMarketCreated
        - event: Deposit(indexed uint256,indexed bytes32,uint256,uint256)
          handler: handleDeposit
        - event: MarketResolved(indexed uint256,uint8,int256)
          handler: handleMarketResolved
        - event: MarketSettled(indexed uint256,bytes32,uint256,uint256)
          handler: handleMarketSettled
        - event: Claimed(indexed uint256,indexed bytes32,indexed address,uint256)
          handler: handleClaimed
      file: ./src/prediction-market.ts
