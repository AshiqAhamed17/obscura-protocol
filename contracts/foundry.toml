[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
]
# The generated UltraHonk verifier is large; optimize so it fits the EIP-170
# 24KB deploy limit.
optimizer = true
optimizer_runs = 200
# Allow tests to read the committed proof fixtures.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
